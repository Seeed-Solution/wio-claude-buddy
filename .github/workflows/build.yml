name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Compile firmware (Wio Terminal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install Wio Terminal core + libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:samd
          arduino-cli lib install \
            "ArduinoJson" \
            "AnimatedGIF" \
            "Grove-3-Axis-Digital-Accelerometer-2g-to-16g-LIS3DHTR" \
            "Seeed Arduino rpcBLE" \
            "Seeed Arduino rpcUnified" \
            "Seeed Arduino rpcWiFi" \
            "PubSubClient"

      - name: Compile firmware (default NET build — WiFi + SenseCraft MQTT)
        run: |
          arduino-cli compile \
            --fqbn Seeeduino:samd:seeed_wio_terminal \
            firmware/claude_buddy/claude_buddy.ino

      - name: Compile firmware (BLE build)
        run: |
          arduino-cli compile \
            --fqbn Seeeduino:samd:seeed_wio_terminal \
            --build-property "compiler.cpp.extra_flags=-DBUDDY_BLE" \
            firmware/claude_buddy/claude_buddy.ino

      - name: Compile firmware (MOCK_DATA build — emulator)
        run: |
          arduino-cli compile \
            --fqbn Seeeduino:samd:seeed_wio_terminal \
            --build-property "compiler.cpp.extra_flags=-DMOCK_DATA" \
            firmware/claude_buddy/claude_buddy.ino

      - name: Native unit test (base64 decoder)
        run: |
          g++ -std=c++17 firmware/claude_buddy/test/test_b64.cpp -o /tmp/test_b64
          /tmp/test_b64

      - name: Native unit test (net_bridge_core wire format)
        run: |
          g++ -std=c++17 firmware/claude_buddy/test/test_net_bridge_core.cpp -o /tmp/test_nbc
          /tmp/test_nbc

  indicator:
    name: Compile firmware (SenseCAP Indicator, ESP-IDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Shared-file diff-guard (Wio <-> Indicator copies)
        run: sh scripts/check_shared_files.sh

      # v5.1 — the version Seeed's SenseCAP_Indicator_ESP32 BSP requires.
      - name: Build (ESP-IDF v5.1, esp32s3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.6
          target: esp32s3
          path: firmware/claude_buddy_indicator

  host:
    name: Lint host bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile bridges + claude_meter
        run: |
          python -m py_compile host/buddy_ble_bridge.py host/buddy_common.py \
            host/buddy_sensecraft_bridge.py host/test_sensecraft_config.py \
            host/claude_meter/*.py
      - name: Host config unit tests
        run: cd host && python -m unittest test_sensecraft_config -v
